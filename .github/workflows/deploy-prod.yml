name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Firestore rules tests
        run: firebase emulators:exec --project demo-jariyah-soft --only firestore,auth,storage "npm run test:rules"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - unit-tests
      - rules-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: E2E tests
        run: firebase emulators:exec --project demo-jariyah-soft --only firestore,auth,storage "npm run test:e2e"

  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: e2e-tests
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Prepare production env
        run: cp .env.production .env.production.local

      - name: Build Next.js app
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase production
        id: deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --project "${{ secrets.FIREBASE_PROJECT_PROD }}" --only hosting,firestore,storage,functions

      - name: Post-deploy health check
        id: healthcheck
        env:
          DEPLOY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: npm run postdeploy:check

      - name: Roll back to previous commit on failure
        if: failure() && github.event_name == 'push'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          git checkout "${{ github.event.before }}"
          npm ci
          npm --prefix functions ci
          cp .env.production .env.production.local
          npm run build
          firebase deploy --project "${{ secrets.FIREBASE_PROJECT_PROD }}" --only hosting,firestore,storage,functions
