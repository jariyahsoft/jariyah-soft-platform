name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Firestore rules tests
        run: npx firebase emulators:exec --project demo-jariyah-soft --only firestore,auth,storage "npm run test:rules"

      - name: Playwright E2E tests
        run: npx firebase emulators:exec --project demo-jariyah-soft --only firestore,auth,storage "npm run test:e2e"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
